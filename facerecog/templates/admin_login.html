<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login</title>
<link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>
<body>
<div class="center-screen">
  <div class="card" style="width:100%; max-width:340px; padding:32px;">
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:24px;">
      <span class="dot" style="width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-dim);"></span>
      <div style="font-weight:600; font-size:16px;">Attendance Admin</div>
    </div>

    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}

    <form method="post">
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter admin password" autofocus required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Log in</button>
    </form>
  </div>
</div>
</body>
</html>
